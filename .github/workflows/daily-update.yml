name: Daily Taiwan Stock Update

on:
  schedule:
    # 16:30 Asia/Taipei = 08:30 UTC
    - cron: "30 8 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional target date YYYYMMDD"
        required: false

permissions:
  contents: write

concurrency:
  group: data-pipeline-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas pyarrow requests streamlit plotly urllib3

      - name: Run daily update
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python scripts/update_daily.py --date "${{ github.event.inputs.date }}"
          else
            python scripts/update_daily.py
          fi
          python scripts/fetch_sectorrotation_reference.py
          if [ -n "$FINMIND_TOKEN" ]; then
            python scripts/update_finmind_data.py
          else
            echo "FINMIND_TOKEN secret is not set; skipped supplemental FinMind update."
          fi
          python scripts/build_formal_json_outputs.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/cache data/processed public/data data_quality_report.json data_quality_report_finmind.json reports logs
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): daily official market update"
            git pull --rebase origin main
            git push
          fi

      - name: Show latest update log on failure
        if: failure()
        run: |
          find logs -type f -name 'update_*.log' -print -exec tail -200 {} \; || true
