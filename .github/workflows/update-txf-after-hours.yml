name: Update TX Futures After Hours

on:
  schedule:
    # 00:00 Asia/Taipei = 16:00 UTC
    - cron: "0 16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow requests
      - name: Update TX futures after-hours data
        env:
          FINMIND_API_TOKEN: ${{ secrets.FINMIND_API_TOKEN }}
        run: python scripts/update_txf_after_hours.py
      - name: Commit updated futures data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/futures_after_hours.parquet public/data/futures_after_hours_latest.json data_quality_report.json
          if git diff --cached --quiet; then
            echo "No futures data changes to commit."
          else
            git commit -m "chore(data): update TX futures after-hours data"
            git push
          fi
